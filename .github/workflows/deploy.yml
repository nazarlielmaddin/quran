name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: "/saadat"
      
      - name: Deploy to gh-pages branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Create or reset gh-pages branch from out/ directory
          git checkout --orphan gh-pages-temp
          git rm -rf . --quiet 2>/dev/null || true
          
          # Copy static exports to root
          cp -r out/* .
          
          # Remove unwanted files
          rm -f .env.local .gitignore .next* 2>/dev/null || true
          
          # Stage static files only (not node_modules or .next/)
          git add index.html 404.html favicon.ico *.svg 2>/dev/null || true
          git add _next/ _not-found* data/ images/ 2>/dev/null || true
          
          # Create commit if there are changes
          git commit -m "Deploy: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          
          # Rename and push
          git branch -M gh-pages-temp gh-pages
          git push -f origin gh-pages